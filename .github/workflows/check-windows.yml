name: Check Windows

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Check Windows application
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint Windows application
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Check frontend JavaScript
        run: npm run check:frontend

      - name: Test frontend JavaScript
        run: npm run test:frontend

      - name: Test shared Rust library
        run: cargo test --locked --lib

      - name: Test Windows backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
