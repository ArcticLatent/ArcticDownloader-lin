name: Check Windows

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Check Windows application
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint Windows application
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # scripts/build-release.ps1 and verify-release.ps1 run this tool
      # directly on the release runner, so it needs to build on Windows too.
      - name: Check manifest-signer tool
        run: cargo check --locked --manifest-path tools/manifest-signer/Cargo.toml --all-targets

      - name: Lint manifest-signer tool
        run: cargo clippy --locked --manifest-path tools/manifest-signer/Cargo.toml --all-targets -- -D warnings

      - name: Check frontend JavaScript
        run: npm run check:frontend

      - name: Test frontend JavaScript
        run: npm run test:frontend

      - name: Test shared Rust library
        run: cargo test --locked --lib

      - name: Test Windows backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Test manifest-signer tool
        run: cargo test --locked --manifest-path tools/manifest-signer/Cargo.toml
