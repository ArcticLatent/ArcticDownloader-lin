name: Check Linux

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Matches packaging/debian/debian/control's Build-Depends: the Tauri
      # Linux backend links against GTK/WebKitGTK/appindicator via pkg-config
      # build scripts, so `cargo check`/`cargo test` fail without these dev
      # packages present even though nothing gets packaged here. libdbus-1-dev
      # is for the `keyring` crate's secret-service backend (Civitai token
      # storage), which links against libdbus via pkg-config at build time.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libdbus-1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Check Linux application
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint shared Rust library
        run: cargo clippy --locked --lib -- -D warnings

      - name: Lint Linux application
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Check frontend JavaScript
        run: npm run check:frontend

      - name: Test frontend JavaScript
        run: npm run test:frontend

      - name: Test shared Rust library
        run: cargo test --locked --lib

      - name: Test Linux backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
