name: Check Linux

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  nix-package:
    name: Build Nix package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      # Cargo checks do not exercise the fileset used by source-package.nix.
      # Build the real derivation so a new workspace member or packaged file
      # cannot be omitted from the Nix source closure unnoticed.
      - name: Build packaged application
        run: nix build .#arctic-comfyui-helper --no-link --print-build-logs

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Downloads a prebuilt cargo-audit binary instead of compiling one,
      # so this job stays fast on every PR/push.
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      # Scans Cargo.lock against the RustSec advisory database. Cargo.lock
      # is shared across both platform crates (see workspace.dependencies
      # in the root Cargo.toml), so one run here covers the Windows build too.
      # `unmaintained`/`unsound` informational advisories stay warn-only
      # (cargo-audit's default); only actual vulnerabilities fail the job.
      - name: Run cargo audit
        run: cargo audit

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Matches packaging/debian/debian/control's Build-Depends: the Tauri
      # Linux backend links against GTK/WebKitGTK/appindicator via pkg-config
      # build scripts, so `cargo check`/`cargo test` fail without these dev
      # packages present even though nothing gets packaged here. libdbus-1-dev
      # is for the `keyring` crate's secret-service backend (Civitai token
      # storage), which links against libdbus via pkg-config at build time.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            desktop-file-utils \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libdbus-1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Check declared Rust 1.89 minimum
        run: |
          rustup toolchain install 1.89.0 --profile minimal --no-self-update
          cargo +1.89.0 check --locked --manifest-path src-tauri/Cargo.toml

      - name: Check Linux application
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint shared Rust library
        run: cargo clippy --locked --lib -- -D warnings

      - name: Lint Linux application
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # `desktop-tray` is on by default (see src-tauri/Cargo.toml), so the
      # check above never compiles the `#[cfg(not(feature = "desktop-tray"))]`
      # no-op branches in app_linux/tray.rs, which only exist without it. A
      # gap here already let a real unused-import/needless-return pair
      # through unnoticed once (see docs/cross-platform-development.md).
      # Linux-only: app_windows.rs's tray code isn't feature-gated at all
      # (confirmed by trying this same flag through the Windows cross-check
      # -- it fails to compile there, a real pre-existing platform asymmetry,
      # not something to "fix" here), so there is no equivalent to add on
      # the Windows side.
      - name: Check Linux application (desktop-tray disabled)
        run: cargo check --locked --no-default-features --manifest-path src-tauri/Cargo.toml

      - name: Lint Linux application (desktop-tray disabled)
        run: cargo clippy --locked --no-default-features --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Release-time only (see tools/manifest-signer/src/main.rs) but not
      # part of either app manifest-path above, so it needs its own check --
      # a break here would silently fail the next release instead of CI.
      - name: Check manifest-signer tool
        run: cargo check --locked --manifest-path tools/manifest-signer/Cargo.toml --all-targets

      - name: Lint manifest-signer tool
        run: cargo clippy --locked --manifest-path tools/manifest-signer/Cargo.toml --all-targets -- -D warnings

      - name: Check frontend JavaScript
        run: npm run check:frontend

      - name: Validate Linux desktop metadata
        run: |
          appstreamcli validate packaging/flatpak/io.github.ArcticHelper.metainfo.xml
          desktop-file-validate packaging/linux/io.github.ArcticHelper.desktop

      - name: Test frontend JavaScript
        run: npm run test:frontend

      - name: Test shared Rust library
        run: cargo test --locked --lib

      - name: Test Linux backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Test Linux backend (desktop-tray disabled)
        run: cargo test --locked --no-default-features --manifest-path src-tauri/Cargo.toml

      - name: Test manifest-signer tool
        run: cargo test --locked --manifest-path tools/manifest-signer/Cargo.toml
